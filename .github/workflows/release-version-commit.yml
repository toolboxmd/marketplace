name: Release version commits on main

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    # Toolybara finalization tags and releases its own promotion merges.
    if: github.actor != 'toolybara[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag, release, and wake reconciliation unless already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_version_commit.py --sha "$GITHUB_SHA"
